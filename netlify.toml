[build.environment]
  # Firebase Web SDK config values are inlined into the client bundle by design
  # (Vite replaces import.meta.env.VITE_* at build time). They are not secrets —
  # Firebase access control is enforced via Security Rules and API key
  # restrictions in the Firebase Console, not by hiding these values. Omit them
  # from secrets scanning to avoid false-positive build failures.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET"
