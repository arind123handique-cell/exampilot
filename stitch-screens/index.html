<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPilot AI Platform — Design Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#4F46E5',
              dark: '#3525CD',
              surface: '#F8F9FF',
              ink: '#0B1C30'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Geist', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="h-screen w-screen flex flex-col bg-slate-900 text-slate-100 font-sans overflow-hidden">
  <!-- Header Bar -->
  <header class="h-14 bg-slate-950 border-b border-slate-800 flex items-center justify-between px-5 flex-shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-display font-bold text-white shadow-sm">
        EP
      </div>
      <div>
        <h1 class="font-display font-semibold text-sm leading-tight text-white flex items-center gap-2">
          ExamPilot AI Platform
          <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-indigo-950 text-indigo-300 border border-indigo-800/60">Stitch Sync</span>
        </h1>
        <p class="text-[11px] text-slate-400">Academic Precision Design System</p>
      </div>
    </div>

    <!-- Screen Selector Dropdown & Quick Toggles -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1 bg-slate-900 border border-slate-700/70 rounded-lg p-1">
        <button id="view-desktop" onclick="setDevice('desktop')" class="px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1.5 transition-colors bg-indigo-600 text-white">
          <span class="material-symbols-outlined text-sm">desktop_windows</span>
          <span>Desktop</span>
        </button>
        <button id="view-mobile" onclick="setDevice('mobile')" class="px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1.5 transition-colors text-slate-400 hover:text-white">
          <span class="material-symbols-outlined text-sm">smartphone</span>
          <span>Mobile (390px)</span>
        </button>
      </div>

      <a id="open-tab" href="02-onboarding-desktop.html" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 hover:text-white flex items-center gap-1.5 transition">
        <span class="material-symbols-outlined text-sm">open_in_new</span>
        <span>Open Raw Screen</span>
      </a>
    </div>
  </header>

  <!-- Main View Area -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Screen List Sidebar -->
    <aside class="w-72 bg-slate-950/80 border-r border-slate-800 flex flex-col flex-shrink-0">
      <div class="p-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800/60">
        Screens (10 Designs)
      </div>
      <nav id="screen-list" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- populated dynamically -->
      </nav>
      <div class="p-3 border-t border-slate-800 text-[11px] text-slate-500 flex items-center justify-between">
        <span>Project: 6042422095099894981</span>
        <span class="text-emerald-400 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Synced
        </span>
      </div>
    </aside>

    <!-- Preview Frame Container -->
    <main class="flex-1 bg-slate-900/60 p-4 flex items-center justify-center overflow-auto">
      <div id="frame-wrapper" class="w-full h-full bg-white rounded-xl shadow-2xl overflow-hidden transition-all duration-300 flex flex-col">
        <iframe id="preview-frame" src="02-onboarding-desktop.html" class="w-full h-full border-none"></iframe>
      </div>
    </main>
  </div>

  <script>
    const screens = [
      { id: '02-onboarding-desktop', file: '02-onboarding-desktop.html', title: '01. Set up Exam — Onboarding', desc: 'Desktop wizard with target exam, year, syllabus flow', icon: 'flag' },
      { id: '01-onboarding', file: '01-onboarding.html', title: '02. Onboarding (Variant)', desc: 'Alternative onboarding flow & exam selector', icon: 'tune' },
      { id: '03-personalized-study-plan', file: '03-personalized-study-plan.html', title: '03. Personalized Study Plan', desc: 'AI syllabus milestones, calendar & study loops', icon: 'calendar_today' },
      { id: '04-syllabus-explorer', file: '04-syllabus-explorer.html', title: '04. Syllabus Explorer & Topics', desc: 'Tree breakdowns, high-yield weightages & notes', icon: 'account_tree' },
      { id: '05-mcq-practice-assessment', file: '05-mcq-practice-assessment.html', title: '05. MCQ Practice & Assessment', desc: 'Timed practice questions, answer keys & hints', icon: 'quiz' },
      { id: '06-full-mock-test-simulation', file: '06-full-mock-test-simulation.html', title: '06. Full Mock Test Simulation', desc: 'Real exam countdown, palette, OMR test runner', icon: 'timer' },
      { id: '07-previous-papers-archive', file: '07-previous-papers-archive.html', title: '07. Previous Papers (PYQ)', desc: 'Historical question bank with frequency heatmaps', icon: 'history_edu' },
      { id: '08-syllabus-aware-ai-tutor', file: '08-syllabus-aware-ai-tutor.html', title: '08. Syllabus-Aware AI Tutor', desc: 'Interactive chat tutor grounded in syllabus', icon: 'smart_toy' },
      { id: '09-progress-analytics', file: '09-progress-analytics.html', title: '09. Progress Analytics & Readiness', desc: 'Retention metrics, radar charts & score projection', icon: 'analytics' },
      { id: '10-mobile-platform', file: '10-mobile-platform.html', title: '10. Mobile Platform Experience', desc: 'Mobile responsive study viewport', icon: 'smartphone' },
      { id: '00-logo', file: '00-logo.svg', title: '11. Brand Logo Asset', desc: 'Official ExamPilot vector logo', icon: 'palette' }
    ];

    let currentScreen = screens[0];
    let currentDevice = 'desktop';

    function renderScreenList() {
      const container = document.getElementById('screen-list');
      container.innerHTML = screens.map(s => {
        const active = s.id === currentScreen.id;
        return `
          <button onclick="selectScreen('${s.id}')" class="w-full text-left p-2.5 rounded-lg text-xs transition flex items-start gap-2.5 ${active ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'}">
            <span class="material-symbols-outlined text-[18px] mt-0.5 ${active ? 'text-white' : 'text-slate-400'}">${s.icon}</span>
            <div class="min-w-0 flex-1">
              <div class="truncate font-display">${s.title}</div>
              <div class="text-[10px] ${active ? 'text-indigo-100' : 'text-slate-400'} truncate">${s.desc}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    function selectScreen(id) {
      const found = screens.find(s => s.id === id);
      if (!found) return;
      currentScreen = found;
      document.getElementById('preview-frame').src = found.file;
      document.getElementById('open-tab').href = found.file;
      renderScreenList();
    }

    function setDevice(device) {
      currentDevice = device;
      const wrapper = document.getElementById('frame-wrapper');
      const btnDesktop = document.getElementById('view-desktop');
      const btnMobile = document.getElementById('view-mobile');

      if (device === 'mobile') {
        wrapper.className = 'w-[390px] h-[844px] bg-white rounded-[32px] border-[8px] border-slate-800 shadow-2xl overflow-hidden transition-all duration-300 flex flex-col my-auto';
        btnMobile.className = 'px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1.5 transition-colors bg-indigo-600 text-white';
        btnDesktop.className = 'px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1.5 transition-colors text-slate-400 hover:text-white';
      } else {
        wrapper.className = 'w-full h-full bg-white rounded-xl shadow-2xl overflow-hidden transition-all duration-300 flex flex-col';
        btnDesktop.className = 'px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1.5 transition-colors bg-indigo-600 text-white';
        btnMobile.className = 'px-2.5 py-1 rounded text-xs font-medium flex items-center gap-1.5 transition-colors text-slate-400 hover:text-white';
      }
    }

    renderScreenList();
  </script>
</body>
</html>
